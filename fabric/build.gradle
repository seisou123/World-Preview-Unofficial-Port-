plugins {
	id 'fabric-loom' version '1.9.2'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds the essential Minecraft/library repositories automatically.

	maven {
		name = 'ParchmentMC'
		url = 'https://maven.parchmentmc.org'
	}

	maven { url 'https://maven.wispforest.io' }

	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	accessWidenerPath = file("src/main/resources/world_preview.accesswidener")
}

// --- Shared multiloader sources: everything loader-neutral lives in ../common ---
// The neoforge module compiles the same common tree against NeoForge mappings.
sourceSets {
	main {
		java.srcDir rootProject.file('common/src/main/java')
		resources.srcDir rootProject.file('common/src/main/resources')
	}
	test {
		java.srcDir rootProject.file('common/src/test/java')
		resources.srcDir rootProject.file('common/src/test/resources')
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

// 共享测量工具：单一副本在仓库同级 world-preview-tools/java，所有孪生/ml 工程共用。
// 只作用于 test sourceSet —— 不进主 jar，不影响发布产物。
sourceSets {
	test {
		java.srcDir rootProject.file('../world-preview-tools/java')
	}
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
	it.options.encoding = 'UTF-8'
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from(rootProject.file("LICENSE")) {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// Source ZIP archive (contains all Java sources + resources for reference)
tasks.register('sourcesZip', Zip) {
	description = 'Bundles all source files into a ZIP archive.'
	group = 'build'
	archiveClassifier = 'sources-zip'
	destinationDirectory = layout.buildDirectory.dir('libs')
	from(rootProject.file('common/src/main/java')) {
		into('java')
	}
	from('src/main/java') {
		into('java')
	}
	from(rootProject.file('common/src/main/resources')) {
		into('resources')
	}
	from('src/main/resources') {
		into('resources')
	}
	from(rootProject.file("LICENSE")) {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Dev JAR (compiled mod classes only, for use in dev environments where
// dependencies are resolved separately)
tasks.register('devJar', Jar) {
	description = 'Assembles a dev JAR containing compiled classes for development.'
	group = 'build'
	archiveClassifier = 'dev'
	from sourceSets.main.output
	from(rootProject.file("LICENSE")) {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// The default build produces the main remapped JAR, the un-remapped dev JAR
// and the sources jar (via withSourcesJar). sourcesZip stays on-demand.
tasks.named('build') {
	dependsOn 'devJar'
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
}
