plugins {
	id 'fabric-loom' version '1.17-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	maven {
		name = 'ParchmentMC'
		url = 'https://maven.parchmentmc.org'
	}

	maven { url 'https://maven.wispforest.io' }

	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	accessWidenerPath = file("src/main/resources/world_preview.accesswidener")
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// For the GUI
	// modImplementation "io.wispforest:owo-lib:${project.owo_version}"

	// Uncomment the following line to enable the deprecated Fabric API modules.
	// These are included in the Fabric API production distribution and allow you to update your mod to the latest modules at a later more convenient time.

		// modImplementation "net.fabricmc.fabric-api:fabric-api-deprecated:${project.fabric_version}"
		testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
	}

	tasks.withType(Test).configureEach {
		useJUnitPlatform()
	}
	
	processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// Source ZIP archive (contains all Java sources + resources for reference)
tasks.register('sourcesZip', Zip) {
	description = 'Bundles all source files into a ZIP archive.'
	group = 'build'
	archiveClassifier = 'sources-zip'
	destinationDirectory = layout.buildDirectory.dir('libs')
	from('src/main/java') {
		into('java')
	}
	from('src/main/resources') {
		into('resources')
	}
	from('LICENSE') {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// Dev JAR (compiled mod classes only, for use in dev environments where
// dependencies are resolved separately)
tasks.register('devJar', Jar) {
	description = 'Assembles a dev JAR containing compiled classes for development.'
	group = 'build'
	archiveClassifier = 'dev'
	from sourceSets.main.output
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// The default build produces the main remapped JAR, the un-remapped dev JAR
// and the sources jar (via withSourcesJar). sourcesZip stays on-demand.
tasks.named('build') {
	dependsOn 'devJar'
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}