plugins {
    id 'net.neoforged.moddev' version '2.0.143'
    id 'maven-publish'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_archives_base_name
}

repositories {
    mavenCentral()
}

// Mojang ships Java 21 to end users in 1.21.x, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(project.java_version as int)

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir 'src/generated/resources'

    // Exclude common development only resources from finalized output.
    exclude '**/*.bbmodel' // BlockBench project files
    exclude 'src/generated/**/.cache' // datagen cache files
}

neoForge {
    version = project.neo_version

    // Validate AT files and raise errors when they have invalid targets
    validateAccessTransformers = true

    runs {
        // applies to all the run configs below
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'

            gameDirectory = project.file('run')
        }

        client {
            client()
        }

        server {
            server()
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods."${project.mod_id}"
    }
}

// Sets up a dependency configuration called 'localRuntime'.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
    testImplementation 'com.google.code.gson:gson:2.11.0'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// Ensure UTF-8 encoding for compilation on all platforms (especially Windows with non-UTF-8 system locale)
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

javadoc {
    options.encoding = 'UTF-8'
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

// --- Additional artifacts ---

// Sources JAR: contains all .java source files for IDE auto-attach
java {
    withSourcesJar()
}

// Source ZIP: complete project source archive (includes build scripts, gradle config, etc.)
tasks.register('sourceZip', Zip) {
    archiveClassifier = 'src'
    archiveExtension = 'zip'
    from(project.rootDir) {
        include 'src/main/java/**/*.java'
        include 'src/main/resources/**'
        include 'src/test/**'
        include 'build.gradle'
        include 'gradle.properties'
        include 'settings.gradle'
        include 'gradle/wrapper/**'
        include 'gradlew'
        include 'gradlew.bat'
        include 'LICENSE'
        include 'CHANGES.md'
        include 'README.md'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    destinationDirectory = layout.buildDirectory.dir('libs')
}

// Dev JAR: compiled classes only (no resources), usable as a compile-time dependency
tasks.register('devJar', Jar) {
    archiveClassifier = 'dev'
    from sourceSets.main.output.classesDirs
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

build.dependsOn 'sourcesJar', 'sourceZip', 'devJar'
